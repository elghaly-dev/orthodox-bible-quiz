<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'">
  <meta name="referrer" content="no-referrer">
  <title>مسابقة الكتاب المقدس</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1 id="title">مسابقة الكتاب المقدس</h1>
    <button id="lang-toggle" type="button">English</button>
  </header>
  <main>
    <section id="start" class="card">
      <p id="intro"></p>
      <button id="start-btn" type="button" class="primary"></button>
    </section>
    <section id="quiz" class="card" hidden>
      <p id="progress" class="muted"></p>
      <h2 id="question"></h2>
      <div id="options" role="list"></div>
      <p id="feedback" aria-live="polite"></p>
      <p id="reference" class="muted"></p>
      <button id="next-btn" type="button" class="primary" hidden></button>
    </section>
    <section id="result" class="card" hidden>
      <h2 id="result-title"></h2>
      <p id="score" class="score"></p>
      <button id="again-btn" type="button" class="primary"></button>
    </section>
  </main>
  <footer>elghaly</footer>
  <script src="quiz-core.js"></script>
  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
